<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <linearGradient id="tileG" x1="0" y1="0" x2="0.12" y2="1">
    <stop offset="0" stop-color="#684064"/>
    <stop offset="0.55" stop-color="#5F3A5C"/>
    <stop offset="1" stop-color="#553351"/>
  </linearGradient>
  <linearGradient id="amberG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBC85A"/><stop offset="1" stop-color="#EDA118"/>
  </linearGradient>
  <linearGradient id="blueG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3B9BF5"/><stop offset="1" stop-color="#1567C8"/>
  </linearGradient>
  <linearGradient id="lightG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FCFCFD"/><stop offset="1" stop-color="#DFE3E8"/>
  </linearGradient>
  <linearGradient id="macBarG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F1F1F3"/><stop offset="1" stop-color="#D9DBDF"/>
  </linearGradient>
  <linearGradient id="linBarG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4A362E"/><stop offset="1" stop-color="#33241E"/>
  </linearGradient>
  <linearGradient id="winBarG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2C3346"/><stop offset="1" stop-color="#1E2432"/>
  </linearGradient>
  <linearGradient id="glossG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
    <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.03"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>

  <filter id="tileSh" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
  </filter>
  <filter id="winSh" x="-30%" y="-30%" width="170%" height="170%">
    <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#160B08" flood-opacity="0.50"/>
  </filter>
  <filter id="curSh" x="-40%" y="-40%" width="190%" height="190%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#160B08" flood-opacity="0.50"/>
  </filter>

  <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="191" ry="191"/></clipPath>
</defs>

<!-- plum tile -->
<g filter="url(#tileSh)">
  <rect x="100" y="100" width="824" height="824" rx="191" ry="191" fill="url(#tileG)"/>
</g>
<rect x="100" y="100" width="824" height="824" rx="191" ry="191" fill="url(#glossG)"/>

<g clip-path="url(#clip)">

  <!-- ============ back window: Linux (left circular controls) ============ -->
  <g filter="url(#winSh)">
    <rect x="207" y="257" width="400" height="300" rx="36" fill="#2A1710"/>
    <rect x="229" y="279" width="356" height="256" rx="18" fill="url(#amberG)"/>
    <path d="M229 297a18 18 0 0 1 18-18h320a18 18 0 0 1 18 18v34H229z" fill="url(#linBarG)"/>
    <!-- close / minimise / maximise -->
    <circle cx="264" cy="305" r="15" fill="#E9573F"/>
    <path d="M258 299l12 12M270 299l-12 12" stroke="#2A1710" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="302" cy="305" r="15" fill="#9B9B9B"/>
    <path d="M295 305h14" stroke="#2A1710" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="340" cy="305" r="15" fill="#9B9B9B"/>
    <rect x="334" y="299" width="12" height="12" rx="1.5" fill="none" stroke="#2A1710" stroke-width="3"/>
  </g>

  <!-- ============ middle window: Windows (right glyph controls) ============ -->
  <g filter="url(#winSh)">
    <rect x="312" y="362" width="400" height="300" rx="36" fill="#2A1710"/>
    <rect x="334" y="384" width="356" height="256" rx="18" fill="url(#blueG)"/>
    <path d="M334 402a18 18 0 0 1 18-18h320a18 18 0 0 1 18 18v34H334z" fill="url(#winBarG)"/>
    <g stroke="#EDEFF2" stroke-width="3.6" fill="none" stroke-linecap="round">
      <path d="M570 410h22"/>
      <rect x="622" y="399" width="22" height="22" rx="1.5"/>
      <path d="M665 399l22 22M687 399l-22 22"/>
    </g>
  </g>

  <!-- ============ front window: macOS (traffic lights) ============ -->
  <g filter="url(#winSh)">
    <rect x="417" y="467" width="400" height="300" rx="36" fill="#2A1710"/>
    <rect x="439" y="489" width="356" height="256" rx="18" fill="url(#lightG)"/>
    <path d="M439 507a18 18 0 0 1 18-18h320a18 18 0 0 1 18 18v34H439z" fill="url(#macBarG)"/>
    <path d="M439 541h356" stroke="#BCC0C6" stroke-width="2"/>
    <circle cx="471" cy="515" r="12" fill="#FF5F57" stroke="#D94E45" stroke-width="1.2"/>
    <circle cx="507" cy="515" r="12" fill="#FEBC2E" stroke="#D69A22" stroke-width="1.2"/>
    <circle cx="543" cy="515" r="12" fill="#28C840" stroke="#1FA534" stroke-width="1.2"/>
  </g>

  <!-- pointer -->
  <g filter="url(#curSh)">
    <path d="M193 626L193 777L230 742L253 794L281 782L260 731L302 728Z"
          fill="#2A1710" stroke="#F7EFE0" stroke-width="11"
          stroke-linejoin="miter" stroke-miterlimit="6"/>
  </g>

</g>
</svg>

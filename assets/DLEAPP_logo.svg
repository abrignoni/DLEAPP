<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DLEAPP logo">
  <title>DLEAPP</title>
  <defs>
    <linearGradient id="dl-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16344F"/>
      <stop offset="1" stop-color="#081420"/>
    </linearGradient>
    <linearGradient id="dl-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C3E5C"/>
      <stop offset="1" stop-color="#12293E"/>
    </linearGradient>
    <radialGradient id="dl-glow" cx="50%" cy="52%" r="60%">
      <stop offset="0" stop-color="#33D6C0" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#33D6C0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#33D6C0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="dl-screenclip">
      <rect x="94" y="178" width="324" height="216" rx="12"/>
    </clipPath>
    <filter id="dl-atomglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="dl-bezelglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- navy tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#dl-tile)"/>

  <!-- window bezel + outer glow -->
  <rect x="84" y="120" width="344" height="284" rx="26" fill="none"
        stroke="#4CD4E8" stroke-width="6" opacity="0.6" filter="url(#dl-bezelglow)"/>
  <rect x="84" y="120" width="344" height="284" rx="26" fill="#0A1D2E"/>

  <!-- lit screen -->
  <g clip-path="url(#dl-screenclip)">
    <rect x="94" y="178" width="324" height="216" fill="url(#dl-screen)"/>
    <ellipse cx="256" cy="292" rx="150" ry="108" fill="url(#dl-glow)"/>
  </g>

  <!-- title bar -->
  <path d="M94 142 a12 12 0 0 1 12 -12 h300 a12 12 0 0 1 12 12 v36 h-324 z" fill="#0E2234"/>
  <line x1="94" y1="178" x2="418" y2="178" stroke="#3484A8" stroke-width="3"/>
  <circle cx="118" cy="150" r="10" fill="#6FE6FF"/>
  <circle cx="148" cy="150" r="10" fill="#33D6C0"/>
  <circle cx="178" cy="150" r="10" fill="#467896"/>

  <!-- bright bezel line -->
  <rect x="84" y="120" width="344" height="284" rx="26" fill="none" stroke="#4CD4E8" stroke-width="4"/>

  <!-- Electron atom -->
  <g>
    <g filter="url(#dl-atomglow)" fill="none" stroke="#33D6C0" stroke-width="9">
      <ellipse cx="256" cy="288" rx="92" ry="35"/>
      <ellipse cx="256" cy="288" rx="92" ry="35" transform="rotate(60 256 288)"/>
      <ellipse cx="256" cy="288" rx="92" ry="35" transform="rotate(120 256 288)"/>
    </g>
    <g fill="none" stroke="#33D6C0" stroke-width="9">
      <ellipse cx="256" cy="288" rx="92" ry="35"/>
      <ellipse cx="256" cy="288" rx="92" ry="35" transform="rotate(60 256 288)"/>
      <ellipse cx="256" cy="288" rx="92" ry="35" transform="rotate(120 256 288)"/>
    </g>
    <g>
      <circle cx="348" cy="288" r="11" fill="#6FE6FF"/>
      <circle cx="210" cy="368" r="11" fill="#6FE6FF"/>
      <circle cx="210" cy="208" r="11" fill="#6FE6FF"/>
      <circle cx="256" cy="288" r="17" fill="#6FE6FF"/>
      <circle cx="256" cy="288" r="7" fill="#E9FCFF"/>
    </g>
  </g>
</svg>

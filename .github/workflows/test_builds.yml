name: Test builds

# Build the CLI and GUI binaries with PyInstaller on every platform PyInstaller
# cannot cross-build for, smoke-test them on their own architecture, and upload
# them as workflow artifacts.
#
# Manual only. This is not the release pipeline; it exists so testable binaries can
# be produced and actually executed per platform without anyone owning the hardware.
#
# The smoke tests are the point, not decoration: iLEAPP's frozen builds shipped a
# startup crash for a long time (missing hidden imports) precisely because nothing
# ever ran a built binary. Every step here that runs a binary is a regression test
# for that class of failure. Ported from iLEAPP's test_builds.yml, with its
# steps that fetch, check and bundle the Unified Log parser.
# Windows only: the Linux and macOS specs are not built here.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Latest supported Python. pillow-heif may lack win_arm64 wheels; that
          # leg is exploratory until a run proves it.
          python-version: '3.14'

      - name: Provide OpenSSL for the cryptography source build (arm64 only)
        # pdfminer.six depends on cryptography, which publishes no win_arm64
        # wheels, so on Windows-on-ARM pip builds it from source: Rust is on the
        # runner already, OpenSSL is not. Step taken verbatim from iLEAPP's
        # test_builds.yml, which hit the same wall.
        if: matrix.arch == 'arm64'
        run: |
          $vcpkg = 'vcpkg'
          if (-not (Get-Command vcpkg -ErrorAction SilentlyContinue)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg C:\vcpkg-local
            & C:\vcpkg-local\bootstrap-vcpkg.bat
            $vcpkg = 'C:\vcpkg-local\vcpkg.exe'
          }
          & $vcpkg install openssl:arm64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $roots = @('C:\vcpkg-local', $env:VCPKG_INSTALLATION_ROOT) | Where-Object { $_ }
          $installed = $roots | ForEach-Object { Join-Path $_ 'installed\arm64-windows-static-md' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $installed) { Write-Error 'vcpkg OpenSSL install dir not found'; exit 1 }
          "OPENSSL_DIR=$installed" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies and PyInstaller
        # Requirements install alone in this step: a pwsh multi-line run does not
        # stop on a failed command, so bundling more commands after it lets a
        # failed install pass silently and surface later as a missing-module
        # crash in the frozen exe (seen on the arm64 leg, run 31444496033).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch the Unified Log parser (digest-verified)
        run: python admin/scripts/fetch_unifiedlog_iterator.py

      - name: Smoke test the parser binary on Windows
        # --help proves the binary starts. On the arm64 runner this is the x64 build
        # under Windows 11's x64 emulation, since Mandiant publishes no windows-arm64
        # parser, so passing there also proves the path an ARM examiner relies on.
        run: |
          bin\unifiedlog_iterator.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check the third-party notices cover the fetched parser
        # The binary statically links Rust crates under their own licenses, and the
        # committed notices file carries their texts. This compares the crate versions
        # whose source paths the binary embeds with that file, without network access.
        run: python admin/scripts/make_unifiedlog_notices.py --verify bin\unifiedlog_iterator.exe

      - name: Build CLI and GUI with PyInstaller
        working-directory: scripts/pyinstaller
        run: |
          pyinstaller dleapp.spec --distpath ..\..\dist_build --workpath ..\..\build_tmp --noconfirm
          pyinstaller dleappGUI.spec --distpath ..\..\dist_build --workpath ..\..\build_tmp --noconfirm

      - name: Smoke test the frozen CLI
        # --help proves the exe survives its imports (the historical crash class).
        # The empty-input run proves module loading, report generation, and clean
        # exit end to end; it must succeed with "no data found" everywhere.
        run: |
          dist_build\dleapp.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Path smoke_in, smoke_out | Out-Null
          "placeholder" | Out-File smoke_in\placeholder.txt
          dist_build\dleapp.exe -t fs -i smoke_in -o smoke_out
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # A raw image is read through the vendored reader imported as a module, which
      # is the path a frozen build is most likely to break: an earlier design ran the
      # reader as a subprocess through sys.executable, and in a bundle that is the
      # tool itself, so -t raw could never work frozen and nothing smoke-tested it.
      - name: Smoke test the frozen CLI on a raw image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path smoke_raw_out | Out-Null
          python -c "import gzip, shutil; shutil.copyfileobj(gzip.open('admin/test/data/raw_images/ntfs-fixture.img.gz'), open('smoke_in/ntfs-fixture.img', 'wb'))"
          dist_build\dleapp.exe -t raw -i smoke_in\ntfs-fixture.img -o smoke_raw_out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $log = Get-ChildItem -Path smoke_raw_out -Recurse -Filter "Screen_Output.html" | Select-Object -First 1
          if (-not $log) { Write-Error "no run log was written"; exit 1 }
          if (-not (Select-String -Path $log.FullName -Pattern "walked lba0: 4" -Quiet)) {
            Write-Error "the frozen build did not walk the NTFS fixture"; exit 1
          }

      - name: Verify the parser and python-evtx are bundled inside both builds
        # A onefile exe unpacks at runtime, so check the build manifests instead:
        # Analysis-00.toc records everything PyInstaller packed. python-evtx is
        # imported only by code bundled as data, which the import graph cannot see,
        # and a build without it reads no event log.
        run: |
          foreach ($build in 'dleapp', 'dleappGUI') {
            $toc = "build_tmp\$build\Analysis-00.toc"
            # "('Evtx.Evtx'," is the packed module; the bare name is also in the toc's
            # list of hidden imports requested, whether or not the module was found.
            foreach ($needle in 'unifiedlog_iterator.exe', 'LICENSE-unifiedlog_iterator', 'THIRD-PARTY-NOTICES-unifiedlog_iterator.txt', "('Evtx.Evtx',") {
              if (-not (Select-String -Path $toc -Pattern $needle -SimpleMatch -Quiet)) {
                Write-Error "$needle is not in the $build build"
                exit 1
              }
            }
          }

      - name: Package artifact
        run: |
          New-Item -ItemType Directory -Path artifact | Out-Null
          Copy-Item dist_build\dleapp.exe artifact\
          Copy-Item dist_build\dleappGUI.exe artifact\
          Copy-Item bin\LICENSE-unifiedlog_iterator artifact\
          Copy-Item bin\THIRD-PARTY-NOTICES-unifiedlog_iterator.txt artifact\

      - uses: actions/upload-artifact@v4
        with:
          name: dleapp-windows-${{ matrix.arch }}-test
          path: artifact/
          retention-days: 14
